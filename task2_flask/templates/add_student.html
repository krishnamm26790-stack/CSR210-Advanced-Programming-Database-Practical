{% extends "base.html" %}

{% block title %}Add New Student - CSR210 Student Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="card-title mb-0 fw-bold">
                    <i class="bi bi-person-plus-fill me-2"></i>Add New Student
                </h4>
            </div>
            <div class="card-body p-4">
                <!-- Form submitting via POST method -->
                <form method="POST" action="{{ url_for('add_student') }}">
                    <!-- Name Input -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Student Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" 
                                   placeholder="e.g. John Doe" required>
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" 
                                   placeholder="e.g. john.doe@example.com" required>
                        </div>
                    </div>

                    <!-- Course Input -->
                    <div class="mb-3">
                        <label for="course" class="form-label fw-semibold">Course / Degree</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-book"></i></span>
                            <input type="text" class="form-control" id="course" name="course" 
                                   placeholder="e.g. B.Tech Computer Science" required>
                        </div>
                    </div>

                    <!-- Marks Input -->
                    <div class="mb-4">
                        <label for="marks" class="form-label fw-semibold">Marks (0 to 100)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-award"></i></span>
                            <input type="number" step="0.1" min="0" max="100" class="form-control" 
                                   id="marks" name="marks" placeholder="e.g. 88.5" required>
                        </div>
                        <div class="form-text">Enter score percentage between 0 and 100.</div>
                    </div>

                    <!-- Submit & Cancel Buttons -->
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('student_list') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4 shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Student
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
